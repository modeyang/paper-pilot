<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperPilot - Academic Side Panel</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="sidepanel-container">
    <!-- 顶部导航栏 -->
    <header class="header">
      <div class="brand">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">PaperPilot</span>
        <span class="badge" id="provider-badge">Magpie</span>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-overview">全文速读</button>
        <button class="tab-btn" data-tab="tab-selection">划词释疑</button>
        <button class="tab-btn" data-tab="tab-settings">设置</button>
      </div>
    </header>

    <!-- Tab 1: 论文全文速读与审稿人视角 -->
    <main id="tab-overview" class="tab-pane active">
      <div class="card paper-info-card">
        <div class="meta-header">
          <div class="meta-label">当前论文</div>
          <button id="btn-refresh-paper" class="small-btn" title="重新识别当前标签页论文元数据">重新识别</button>
        </div>
        <div id="paper-title" class="paper-title">未检测到学术论文（请打开 arXiv / bioRxiv / PubMed 页面或手动输入）</div>
        <div id="paper-authors" class="paper-authors"></div>
        <details id="manual-paper-details" class="manual-paper-details">
          <summary>手动粘贴论文标题/摘要（PDF 兜底）</summary>
          <div class="manual-paper-form">
            <input type="text" id="input-manual-title" class="form-control" placeholder="论文标题（选填）" />
            <textarea id="input-manual-abstract" class="form-control" rows="3" placeholder="粘贴论文摘要或核心段落..."></textarea>
            <button id="btn-apply-manual-paper" class="small-btn manual-apply-btn">载入此内容</button>
          </div>
        </details>
      </div>

      <div class="action-grid">
        <button id="btn-tldr" class="action-btn primary">
          <span>⚡</span> 一键 4 维速读
        </button>
        <button id="btn-critique" class="action-btn danger">
          <span>🧐</span> 顶会审稿人盲评 (Critique)
        </button>
      </div>

      <div class="output-container">
        <div class="output-header">
          <span class="output-title">分析结果</span>
          <div class="output-actions">
            <button id="btn-reset-overview" class="small-btn" data-testid="overview-reset">重置</button>
            <button id="btn-copy-overview" class="small-btn">复制</button>
          </div>
        </div>
        <div id="overview-output" class="markdown-body">
          点击上方按钮，基于当前论文自动进行专业研读分析...
        </div>
        <div class="followup-bar">
          <input type="text" id="input-overview-followup" class="form-control followup-input" data-testid="overview-followup-input" placeholder="针对当前论文继续追问..." />
          <button id="btn-overview-followup" class="small-btn followup-btn" data-testid="overview-followup-send">追问</button>
        </div>
      </div>
    </main>

    <!-- Tab 2: 划选文本与公式白话释疑 -->
    <main id="tab-selection" class="tab-pane">
      <div class="card selection-card">
        <div class="meta-label">划选文本 / 公式内容（可直接输入或编辑）</div>
        <textarea id="selected-text-preview" class="selection-preview" rows="4" placeholder="在学术论文中用鼠标划选任意文本或公式，或直接在此粘贴/输入待解读内容..."></textarea>
      </div>

      <div class="action-grid">
        <button id="btn-explain-formula" class="action-btn primary">
          <span>📐</span> 公式几何与物理直觉解读
        </button>
        <button id="btn-explain-plain" class="action-btn">
          <span>💡</span> 通俗大白话讲透
        </button>
      </div>

      <div class="output-container">
        <div class="output-header">
          <span class="output-title">释疑输出</span>
          <div class="output-actions">
            <button id="btn-reset-selection" class="small-btn" data-testid="selection-reset">重置</button>
            <button id="btn-copy-selection" class="small-btn">复制</button>
          </div>
        </div>
        <div id="selection-output" class="markdown-body">
          等待生成直觉解读...
        </div>
        <div class="followup-bar">
          <input type="text" id="input-selection-followup" class="form-control followup-input" data-testid="selection-followup-input" placeholder="围绕该公式或段落继续追问..." />
          <button id="btn-selection-followup" class="small-btn followup-btn" data-testid="selection-followup-send">追问</button>
        </div>
      </div>
    </main>

    <!-- Tab 3: BYOK 设置与模型配置 -->
    <main id="tab-settings" class="tab-pane">
      <div class="settings-form">
        <div class="form-group">
          <label for="select-provider">AI 提供商 (Provider)</label>
          <select id="select-provider" class="form-control">
            <option value="magpie">本地 Magpie 网关 (127.0.0.1:3425)</option>
            <option value="deepseek">DeepSeek (推荐·数学推理最强)</option>
            <option value="openai">OpenAI (GPT-4o / GPT-4o-mini)</option>
            <option value="anthropic">Anthropic (Claude 3.5 Sonnet)</option>
            <option value="ollama">本地 Ollama (完全保密与离线)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="input-api-key">API Key (保存在本地沙箱)</label>
          <input type="password" id="input-api-key" class="form-control" placeholder="sk-..." />
        </div>

        <div class="form-group">
          <label for="input-base-url">API Base URL</label>
          <input type="text" id="input-base-url" class="form-control" />
        </div>

        <div class="form-group">
          <label for="input-model">模型名称 (Model Name)</label>
          <input type="text" id="input-model" class="form-control" list="model-suggestions" />
          <datalist id="model-suggestions"></datalist>
        </div>

        <div class="form-group">
          <label for="select-capsule-enabled">划词悬浮胶囊 (Ask PaperPilot)</label>
          <select id="select-capsule-enabled" class="form-control">
            <option value="true">开启（仅限学术论文站点）</option>
            <option value="false">关闭（仅使用侧边栏直接输入或快捷键）</option>
          </select>
        </div>

        <div class="form-actions">
          <button id="btn-save-settings" class="btn-save">保存配置</button>
          <button id="btn-test-connection" class="btn-test">测试连通性</button>
        </div>
        <div id="settings-status" class="status-msg"></div>

        <div class="security-notice">
          🔒 <strong>隐私保证</strong>：API Key 仅存储在浏览器的本地 <code>chrome.storage.local</code> 中。所有大模型请求均从你本地浏览器直接发出，不通过任何第三方中间服务器。
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
