name: Build & Package Chrome Extension (MV3)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run compile || true

      - name: Build Chrome Extension (MV3)
        run: npm run build

      - name: Create Web Store Zip Bundle
        run: npm run zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pilot-chrome-mv3
          path: .output/*.zip
